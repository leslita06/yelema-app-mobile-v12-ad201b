*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--stage);color:var(--ink);font-family:Onest,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.35}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.phone{position:relative;width:390px;max-width:100%;height:812px;max-height:calc(100vh - 32px);min-height:640px;background:var(--bg);border-radius:42px;border:8px solid var(--frame);overflow:hidden;box-shadow:0 24px 60px rgb(23 17 43/.25);isolation:isolate}
@media (max-width:430px){.stage{padding:0}.phone{border:0;border-radius:0;height:100vh;max-height:none}}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.col{display:flex;flex-direction:column}
/* main */
.main{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.scr{display:none;flex:1;min-height:0;flex-direction:column}.scr.on{display:flex}
.mh{flex:none;padding:10px 16px 0}
.mh .r1{display:flex;align-items:center;justify-content:space-between;height:36px}
.mh .wl{width:30px;height:30px;border-radius:9px;object-fit:contain;border:1px solid var(--line);background:#fff;padding:2px}
.mh .ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.mh .ib:active{background:var(--soft)}
.mh h1{font-family:"Bricolage Grotesque",Onest,sans-serif;font-weight:700;font-size:30px;line-height:1.1;margin:6px 0 10px;letter-spacing:-.01em}
.sch{display:flex;align-items:center;gap:8px;height:38px;border-radius:12px;background:var(--soft);padding:0 12px;color:var(--ink3);margin-bottom:10px}
.sch input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:16px}
.sch input::placeholder{color:var(--ink3)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none;flex:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 9px;border-radius:999px;background:var(--soft);font-size:13.5px;font-weight:500;color:var(--ink2);display:flex;align-items:center}
.chip[aria-pressed=true]{background:var(--accp);color:var(--acc);font-weight:600}
.list{flex:1;min-height:0;overflow-y:auto}
.row{display:flex;align-items:center;gap:12px;padding:0 16px;width:100%;min-height:72px}
.row:active{background:var(--soft)}
.row .av{margin:10px 0}
.row .tx{flex:1;min-width:0;align-self:stretch;display:flex;flex-direction:column;justify-content:center;border-bottom:.5px solid var(--line);padding:9px 0}
.row:last-child .tx{border-bottom:0}
.rt{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.rt b{font-size:16.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt em{font-style:normal;font-size:12.5px;color:var(--ink3);flex:none}
.row.un .rt em{color:var(--acc);font-weight:600}
.rb{display:flex;align-items:center;gap:6px;margin-top:2px}
.rb span.p{flex:1;min-width:0;font-size:14.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.rb .ic{width:16px;height:16px}
.tick{color:var(--acc)}
.bdg{flex:none;min-width:21px;height:21px;border-radius:11px;background:var(--acc);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.pin{width:15px;height:15px;color:var(--ink3);flex:none}
.av{position:relative;flex:none;width:52px;height:52px;border-radius:50%}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:var(--soft)}
.av.y img{object-fit:contain;padding:6px;background:#f1effc}
.av .st{position:absolute;right:0;bottom:1px;width:13px;height:13px;border-radius:50%;background:#3d9b62;box-shadow:0 0 0 2px var(--bg)}
.mos{flex:none;width:52px;height:52px;border-radius:16px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:1.5px;background:var(--line)}
.mos img{width:100%;height:100%;object-fit:cover;display:block}
.mos.s1{grid-template-columns:1fr}
.fab{position:absolute;right:16px;bottom:86px;width:58px;height:58px;border-radius:50%;background:#f1effc;border:2px solid var(--acc);display:grid;place-items:center;box-shadow:0 6px 18px rgb(48 22 103/.35);z-index:3;padding:0}.fab img{width:40px;height:40px;object-fit:contain}
.tabs{flex:none;display:flex;border-top:.5px solid var(--line);background:var(--surface);padding:7px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:500;color:var(--ink3);position:relative}
.tab[aria-current=page]{color:var(--acc);font-weight:700}
.tab .ic{width:25px;height:25px}
.tab .b{position:absolute;top:-3px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--acc);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.tab .d{position:absolute;top:0;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 2px var(--surface)}
.sec{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding:14px 16px 4px}
/* statuts */
.ring{position:relative;width:60px;height:60px;flex:none;margin:8px 0;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring img{width:50px;height:50px;border-radius:50%;object-fit:cover}
.ring.y img{object-fit:contain;background:#f1effc;padding:5px}
/* pages */
.pg{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s cubic-bezier(.3,.7,.2,1);z-index:10;visibility:hidden}
.pg.on{transform:none;visibility:visible}
.pg.up{transform:translateY(100%)}.pg.up.on{transform:none}
.ph{flex:none;height:56px;display:flex;align-items:center;gap:6px;padding:0 6px 0 4px;background:var(--surface);border-bottom:.5px solid var(--line)}
.ph .ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.ph .ib:active{background:var(--soft)}
.ph .who{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:100%;padding-right:4px}
.ph .who .av,.ph .who .mos{width:38px;height:38px}
.ph .who .mos{border-radius:12px}
.ph .who b{display:block;font-size:16.5px;font-weight:600;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .who small{display:block;font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .who small.w{color:var(--acc)}
.pt{flex:1;font-weight:600;font-size:17px;padding-left:4px}
.msgs{flex:1;min-height:0;overflow-y:auto;background:var(--chat) var(--wp);padding:8px 10px 10px;display:flex;flex-direction:column;gap:3px}
.dsep{align-self:center;background:var(--surface);color:var(--ink3);font-size:12px;font-weight:500;padding:4px 11px;border-radius:9px;margin:8px 0;box-shadow:0 1px 1px rgb(0 0 0/.05)}
.sysm{align-self:center;background:var(--surface);color:var(--ink3);font-size:12.5px;padding:5px 12px;border-radius:10px;margin:6px 0;text-align:center;max-width:90%}
.m{position:relative;max-width:82%;padding:6px 9px 5px 10px;border-radius:12px;font-size:15.5px;line-height:1.3;box-shadow:0 1px 1px rgb(0 0 0/.07);word-wrap:break-word;overflow-wrap:anywhere}
.m.in{align-self:flex-start;background:var(--bin);border-top-left-radius:3px}
.m.out{align-self:flex-end;background:var(--bout);border-top-right-radius:3px}
.m.in.tl::before,.m.out.tl::before{content:"";position:absolute;top:0;width:9px;height:11px}
.m.in.tl::before{left:-8px;background:var(--bin);clip-path:polygon(100% 0,0 0,100% 100%)}
.m.out.tl::before{right:-8px;background:var(--bout);clip-path:polygon(0 0,100% 0,0 100%)}
.m .mt{float:right;margin:7px 0 -3px 10px;font-size:11px;color:var(--ink3);display:flex;align-items:center;gap:3px;line-height:1}
.m .mt .ic{width:16px;height:16px;color:var(--acc)}
.m .sn{display:block;font-size:13px;font-weight:700;margin-bottom:1px}
.mn{color:var(--acc);font-weight:600}
.doc{padding:4px 4px 5px}
.doc .pv{display:block;width:240px;max-width:100%;border-radius:9px;overflow:hidden;background:var(--soft)}
.doc .pv img{display:block;width:100%;height:200px;object-fit:cover;object-position:top}
.doc .bar{display:flex;align-items:center;gap:10px;padding:8px 6px 2px}
.doc .bar b{display:block;font-size:14.5px;font-weight:600;line-height:1.2}
.doc .bar small{font-size:12.5px;color:var(--ink3)}
.doc .bar .dl{margin-left:auto;width:36px;height:36px;border-radius:50%;background:var(--accp);color:var(--acc);display:grid;place-items:center;flex:none}
.doc .mt{margin:2px 6px 0 0}
.callm{display:flex;align-items:center;gap:10px;min-width:210px;padding:4px 2px 2px}
.callm .ci{width:38px;height:38px;border-radius:50%;background:var(--accp);color:var(--acc);display:grid;place-items:center;flex:none}
.callm b{display:block;font-size:15px;font-weight:600}.callm small{font-size:13px;color:var(--ink3)}
.qr{align-self:flex-start;display:flex;flex-direction:column;gap:3px;width:min(82%,300px);margin-top:1px}
.qr button{background:var(--bin);color:var(--acc);font-weight:600;font-size:15px;text-align:center;padding:10px;border-radius:10px;box-shadow:0 1px 1px rgb(0 0 0/.07);display:flex;align-items:center;justify-content:center;gap:7px}
.qr button .ic{width:17px;height:17px}
.inp{flex:none;display:flex;align-items:flex-end;gap:6px;padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--chat)}
.inp .fld{flex:1;min-width:0;display:flex;align-items:center;gap:4px;background:var(--surface);border-radius:22px;padding:0 6px 0 12px;min-height:44px;box-shadow:0 1px 1px rgb(0 0 0/.06)}
.inp .fld input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:16px;height:44px}
.inp .fld input::placeholder{color:var(--ink3)}
.inp .ib2{width:34px;height:34px;display:grid;place-items:center;color:var(--ink3);flex:none}
.inp .snd{width:46px;height:46px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.typ{align-self:flex-start;background:var(--bin);border-radius:12px;border-top-left-radius:3px;padding:10px 13px;display:flex;gap:4px;box-shadow:0 1px 1px rgb(0 0 0/.07)}
.typ i{width:7px;height:7px;border-radius:50%;background:var(--ink3);opacity:.5;animation:bl 1.1s infinite}
.typ i:nth-child(2){animation-delay:.18s}.typ i:nth-child(3){animation-delay:.36s}
@keyframes bl{0%,60%,100%{opacity:.35;transform:none}30%{opacity:1;transform:translateY(-3px)}}
/* profil */
.pbody{flex:1;min-height:0;overflow-y:auto;background:var(--soft)}
.hero{background:var(--surface);padding:22px 16px 16px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.hero .av{width:128px;height:128px;margin-bottom:10px}
.hero h2{margin:0;font-family:"Bricolage Grotesque",Onest,sans-serif;font-size:24px}
.hero p{margin:0;color:var(--ink3);font-size:15px}
.acts{display:flex;gap:10px;margin-top:14px;width:100%}
.acts button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;border-radius:14px;background:var(--soft);color:var(--acc);font-size:13px;font-weight:600}
.blk{background:var(--surface);margin-top:10px;padding:4px 0}
.blk h4{margin:0;padding:12px 16px 6px;font-size:13px;font-weight:600;color:var(--ink3);display:flex;justify-content:space-between}
.blk h4 span{color:var(--acc);font-weight:600}
.kv{display:flex;align-items:center;gap:14px;padding:11px 16px;width:100%}
.kv .ic{color:var(--ink3)}.kv b{display:block;font-weight:500;font-size:15.5px}.kv small{color:var(--ink3);font-size:13px}
.thr{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 12px;scrollbar-width:none}.thr::-webkit-scrollbar{display:none}
.thr .th{flex:none;width:96px}
.thr .th i{display:block;width:96px;height:96px;border-radius:12px;background:var(--soft) center/cover}
.thr .th small{display:block;font-size:12px;color:var(--ink3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* livrables */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:2px 16px 16px;overflow-y:auto;flex:1;min-height:0;grid-auto-rows:max-content;align-content:start}
.lc{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column;width:100%;min-width:0;align-self:start}
.lc .tb{display:grid;place-items:center;aspect-ratio:1.15;background:var(--accp);color:var(--acc);background-size:cover;background-position:top}
.lc .tb .ic{width:34px;height:34px}
.lc .ti{display:block;padding:8px 10px 10px;min-width:0}
.lc b{display:block;font-size:14px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc .by{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:12px;color:var(--ink3)}
.lc .by img{width:18px;height:18px;border-radius:50%;object-fit:cover}
/* réglages */
.set{flex:1;min-height:0;overflow-y:auto;background:var(--soft)}
.grp{background:var(--surface);margin:10px 0;border-block:.5px solid var(--line)}
.sr{display:flex;align-items:center;gap:14px;padding:0 16px;min-height:50px;width:100%}
.sr .sq{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.sr .sq .ic{width:18px;height:18px}
.sr span.l{flex:1;font-size:16px;padding:12px 0;border-bottom:.5px solid var(--line);align-self:stretch;display:flex;align-items:center}
.sr:last-child span.l{border-bottom:0}
.sr .cv{color:var(--ink3);width:18px;height:18px}
.sw{width:50px;height:30px;border-radius:999px;background:#c9c6d6;position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0/.3);transition:.2s}
[aria-checked=true] .sw{background:var(--ok)}[aria-checked=true] .sw::after{transform:translateX(20px)}
.prof{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);width:100%}
.prof img{width:64px;height:64px;border-radius:50%;object-fit:cover}
.prof b{display:block;font-size:19px;font-weight:600}.prof small{color:var(--ink3);font-size:14px}
/* sheet */
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink3);display:grid;place-items:center;color:#fff;flex:none}
[aria-checked=true] .chk{background:var(--acc);border-color:var(--acc)}
.nm{margin:12px 16px;border-bottom:2px solid var(--acc);display:flex}
.nm input{flex:1;border:0;outline:0;background:none;font-size:17px;padding:8px 0}
.btnp{margin:12px 16px;height:46px;border-radius:23px;background:var(--brand);color:#fff;font-weight:600;font-size:16px;text-align:center;display:grid;place-items:center;width:calc(100% - 32px)}
/* viewer */
.vw{position:absolute;inset:0;z-index:30;background:#000;color:#fff;display:none;flex-direction:column}
.vw.on{display:flex}
.vw .pgb{display:flex;gap:3px;padding:10px 10px 0;flex:none}
.vw .pgb i{flex:1;height:3px;border-radius:2px;background:rgb(255 255 255/.35);overflow:hidden}
.vw .pgb i b{display:block;height:100%;width:0;background:#fff}
.vw .vh{display:flex;align-items:center;gap:10px;padding:10px 12px;flex:none}
.vw .vh img{width:38px;height:38px;border-radius:50%;object-fit:cover}
.vw .vh div{flex:1;line-height:1.2}.vw .vh small{opacity:.8;font-size:12.5px}
.vw .sl{flex:1;min-height:0;margin:0 0 0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px 26px;text-align:center;position:relative}
.vw .sl h3{font-family:"Bricolage Grotesque",Onest,sans-serif;font-size:30px;line-height:1.15;margin:0 0 12px}
.vw .sl p{font-size:18px;line-height:1.4;margin:0;opacity:.95;white-space:pre-line}
.vw .sl .pic{width:78%;max-height:50%;border-radius:14px;object-fit:cover;object-position:top;margin-bottom:14px;box-shadow:0 10px 30px rgb(0 0 0/.4)}
.vw .sl .cap{font-size:17px}
.vw .sl .ab{display:flex;gap:10px;margin-top:22px;position:relative;z-index:2}
.vw .sl .ab button{height:44px;padding:0 22px;border-radius:22px;font-weight:700;font-size:16px;background:#fff;color:#17112b;text-align:center}
.vw .sl .ab button.n{background:rgb(255 255 255/.18);color:#fff}
